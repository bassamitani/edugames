<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Math Arena Classroom Edition</title>
         <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
 <!-- KaTeX Auto-Render Extension with Custom Delimiter Config -->
        <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"
                onload="renderMathInElement(document.body, {
                        delimiters: [
                                {left: '$$', right: '$$', display: true},
                                {left: '$', right: '$', display: false},
                                {left: '\\(', right: '\\)', display: false},
                                {left: '\\[', right: '\\]', display: true}
                        ],
                        throwOnError: false
                });">
                </script>
 <style>
 :root {
 --bg-dark: #0f172a; --panel-bg: #1e293b; --border-color: #cbd5e1;
 --blue-team: #3b82f6; --red-team: #ef4444; --text-main: #f8fafc;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
 body { background-color: #f1f5f9; color: #334155; overflow-y: auto; min-height: 100vh; display: flex; flex-direction: column; }
 .screen { display: none; width: 100%; }
 .screen.active { display: flex; }
 .hidden { display: none !important; }
 h1, h2, h3 { text-align: center; margin-bottom: 20px; color: #fff; }
 .btn { padding: 12px 24px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s ease; color: white; }
 .btn-blue { background-color: var(--blue-team); }
 .btn-slate { background-color: #475569; }
 .team-input-box { width: 100%; padding: 10px; margin-top: 5px; background: #2d3748; border: 1px solid #4a5568; border-radius: 4px; color: #fff; font-size: 15px; }
 .answer-preview-screen { width: 100%; height: 44px; background-color: #fff; border: 1px solid #cbd5e1; border-radius: 8px; color: #334155; font-size: 22px; font-weight: bold; text-align: center; line-height: 44px; margin-bottom: 12px; }
 .arena-wrapper { position: relative !important; width: 100% !important; flex: 1 !important; min-height: 340px !important; overflow: hidden !important; background: #ffffff !important; border: 1px solid #cbd5e1; border-radius: 12px; margin-bottom: 10px !important; display: flex !important; align-items: center !important; justify-content: center !important; }
 #center-line-marker { position: absolute !important; top: 0 !important; left: 50% !important; transform: translateX(-50%) !important; width: 0px !important; height: 100% !important; border-left: 2px dashed #475569 !important; z-index: 5 !important; pointer-events: none !important; display: block; }
 .timer-track-wrapper { width: 100%; height: 5px; background-color: #cbd5e1; border-radius: 3px; overflow: hidden; margin-top: 12px; }
 #global-timer { width: 0%; height: 100%; background: linear-gradient(90deg, #f59e0b, #ef4444); }
 .key-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; transition: background 0.1s; color: #1e293b; }
 .key-btn:active { background: #cbd5e1; }
 .mcq-grid { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 5px; }
 .mcq-btn { width: 100%; padding: 14px 10px; font-size: 20px; font-weight: bold; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; cursor: pointer; text-align: center; color: #1e293b; transition: background 0.1s; }
 .mcq-btn:active { background: #e2e8f0; }
 .floating-score-pop { position: fixed !important; top: 40% !important; font-size: 55px !important; font-weight: 900 !important; z-index: 999999 !important; pointer-events: none !important; animation: scoreFadeUp 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards !important; text-shadow: 0 4px 12px rgba(0,0,0,0.5), 0 0 20px currentColor !important; white-space: nowrap; }
 .pop-p1 { left: 20% !important; color: #2563eb !important; }
 .pop-p2 { right: 20% !important; color: #dc2626 !important; }
 @keyframes scoreFadeUp { 0% { opacity: 0; transform: translateY(-20%) scale(0.5); } 20% { opacity: 1; transform: translateY(-50%) scale(1.3); } 80% { opacity: 1; transform: translateY(-60%) scale(1); } 100% { opacity: 0; transform: translateY(-90%) scale(0.8); } }

 /* Responsive adjustments ONLY for low-height mobile viewports in landscape (Level 4) */
@media (max-height: 600px) and (max-width: 980px) {

    /* 1. MCQ Panel: Convert vertical list into a compact 2x2 grid layout */
    .mcq-grid:not(.hidden) {
        display: grid !important;
        grid-template-columns: repeat(2, 1fr) !important;
        grid-template-rows: repeat(2, 1fr) !important;
        gap: 4px !important;
        margin-top: 2px !important;
    }

    .mcq-btn {
        width: 100% !important;
        height: 100% !important;
        padding: 6px 4px !important;
        font-size: 15px !important;
        border-radius: 6px !important;
    }

    /* 2. Keypad Mode: Compress layout elements and fit matrix view */
    #p1-keypad-panel, #p2-keypad-panel {
        display: flex !important;
        flex-direction: column !important;
        gap: 4px !important;
    }

    /* The 3x4 grid container holding keys 0-9, X, and R */
    #p1-keypad-panel > div, #p2-keypad-panel > div {
        gap: 4px !important; /* Tightens gaps between buttons */
    }

    .key-btn {
        padding: 6px 0 !important; /* Shrinks the key height paddings */
        font-size: 15px !important;
        border-radius: 4px !important;
    }

    /* Force full-width blue submit button to adapt down nicely */
    button[onclick^="submitAnswer"] {
        padding: 6px 0 !important;
        margin-top: 0px !important;
        font-size: 15px !important;
    }

    /* 3. Global Layout Balance Controls to save precious screen vertical space */
    #p1-formula-box, #p2-formula-box {
        font-size: 20px !important;
        padding: 4px !important;
        margin: 4px 0 !important;
        flex: 0.6 !important;
    }

    .answer-preview-screen {
        height: 28px !important;
        line-height: 28px !important;
        margin-bottom: 4px !important;
    }
}

 </style>
</head>
<body>
 <!-- PRELOADER SCREEN -->
 <div id="preloader-screen" style="position: fixed; top:0; left:0; width:100%; height:100%; background:#0f172a; z-index:99999; display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.4s ease;">
 <img id="ml" style="display: flex; justify-content: center; align-items: center;margin-bottom: 40px;" alt="Base64 Image Example" />
 <div style="font-size:24px; font-weight:bold; margin-bottom:15px; color:#fff;" id="load-status-text">Loading Local Media Assets: 0%</div>
 <div style="width:260px; height:8px; background:#1e293b; border-radius:4px; overflow:hidden;">
 <div id="loader-bar" style="width:0%; height:100%; background:#3b82f6; transition:width 0.1s linear;"></div>
 </div>
 <video id="asset-preloader" muted playsinline style="display:none; width:1px; height:1px;"></video>
 </div>

 <!-- MAIN MENU SCREEN -->
 <div id="menu-screen" class="screen active" style="justify-content:center; align-items:center; min-height:100vh; flex-direction:column; background-color:#0f172a;">
 <img id="ml2" style="display: flex; justify-content: center; align-items: center;" alt="Base64 Image Example" />
 <br>
 <p style="color:#64748b; margin-bottom:30px; font-weight:bold;">Web design and coding by: Bassam Itani</p>
 <br>
 <h1 style="font-size:42px; margin-bottom:10px; background:linear-gradient(to right, #3b82f6, #ef4444); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">MATH ARENA</h1>
 <p style="color:#64748b; margin-bottom:30px; font-weight:bold;">Classroom Multiplayer Tournament Edition</p>
 <div style="display:flex; justify-content:center; width:100%; max-width:400px;">
 <button class="btn btn-blue" style="width:100%; padding:20px; font-size:18px; font-weight:bold;" onclick="openSettings()">Setup Battle Arena</button>
 </div>
 </div>

 <!-- CONFIGURATION SETTINGS SCREEN -->
 <div id="settings-screen" class="screen" style="min-height: 100vh; display: none; align-items: center; justify-content: center; background-color: #0f172a; width: 100vw; max-width: 100vw; padding: 10px;">
 <div style="background-color:#1e293b; border:1px solid #334155; padding:16px; border-radius:12px; width:100%; max-width:600px; margin: auto; display: flex; flex-direction: column; max-height: 96vh;">
 <h2 style="margin-bottom:12px; font-size: 22px; color:#fff; text-align: center;">Match Configuration Panel (Level 4)</h2>

 <!-- Team Names Row -->
 <div style="display:flex; gap:12px; margin-bottom:12px;">
 <div style="flex:1;">
 <label style="font-size:13px; font-weight:bold; color:#94a3b8;">Left Side Name:</label>
 <input type="text" id="t1-name-input" value="1-Jamoa" class="team-input-box" style="margin-top: 2px; padding: 8px;">
 </div>
 <div style="flex:1;">
 <label style="font-size:13px; font-weight:bold; color:#94a3b8;">Right Side Name:</label>
 <input type="text" id="t2-name-input" value="2-Jamoa" class="team-input-box" style="margin-top: 2px; padding: 8px;">
 </div>
 </div>

 <!-- Input Mode Row -->
 <div style="margin-bottom:12px;">
 <label style="font-size:13px; font-weight:bold; color:#94a3b8; display:block;">Gameplay Input Rendering Mode:</label>
 <select id="match-input-mode-select" class="team-input-box" style="background: #2d3748; cursor: pointer; font-weight: bold; margin-top: 2px; padding: 8px;">
 <option value="KEYPAD">Numerical Keypad Matrix View Mode</option>
 <option value="MCQ" selected>4-Option Multiple Choice Grid (MCQ Mode)</option>
 </select>
 </div>

 <!-- Core Operations Grid -->
 <div style="margin-bottom:12px;">
 <label style="font-size:13px; font-weight:bold; color:#94a3b8; display:block; margin-bottom:4px;">Core Whole Number Operations:</label>
 <div style="display:grid; grid-template-columns: repeat(4, 1fr); gap:8px; color:#fff; background:#0f172a; padding:10px; border-radius:6px; border:1px solid #334155; font-size: 13px;">
 <label style="cursor:pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="q-add" checked> Add (+)</label>
 <label style="cursor:pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="q-sub"> Sub (-)</label>
 <label style="cursor:pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="q-mul"> Mul (×)</label>
 <label style="cursor:pointer; display: flex; align-items: center; gap: 4px;"><input type="checkbox" id="q-div"> Div (÷)</label>
 </div>
 </div>

 <!-- Mental Strategies Scroll Box -->
 <div style="margin-bottom:16px; flex: 1; min-height: 120px; display: flex; flex-direction: column;">
 <label style="font-size:13px; font-weight:bold; color:#94a3b8; display:block; margin-bottom:4px;">Level 4 Mental Strategies Matrix:</label>
 <div style="display:flex; flex-direction:column; gap:10px; color:#fff; background:#0f172a; padding:12px; border-radius:6px; border:1px solid #334155; overflow-y: auto; max-height: 180px;">
 <label style="cursor:pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13px;">
 <input type="checkbox" id="strat-pow10" style="margin-top: 2px;">
 <span>Multiply whole numbers by 10, 100, 1000</span>
 </label>
 <label style="cursor:pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13px;">
 <input type="checkbox" id="strat-assoc" style="margin-top: 2px;">
 <span>Multiply 3 numbers using associative properties</span>
 </label>
 <label style="cursor:pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13px;">
 <input type="checkbox" id="strat-dist" style="margin-top: 2px;">
 <span>Multiply multi-digit by 1-digit using Distributive Property</span>
 </label>
 <label style="cursor:pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13px;">
 <input type="checkbox" id="strat-rem" style="margin-top: 2px;">
 <span>Divide whole numbers by 1-digit with/without remainder</span>
 </label>
 <label style="cursor:pointer; display: flex; align-items: flex-start; gap: 8px; font-size: 13px;">
 <input type="checkbox" id="strat-tens" style="margin-top: 2px;">
 <span>Divide tens, hundreds, thousands by numbers to 10</span>
 </label>
 </div>
 </div>

 <!-- Fixed Action Buttons at the Bottom -->
 <div style="display:flex; gap:12px; padding-top: 4px; margin-top: auto;">
 <button class="btn btn-slate" style="flex:1; padding: 10px;" onclick="backToMenu()">Back</button>
 <button class="btn btn-blue" style="flex:2; padding: 10px;" onclick="startMatch()">Start Battle Arena</button>
 </div>
 </div>
 </div>
 <!-- GAME ARENA SCREEN -->
 <div id="game-screen" class="screen" style="max-width: 100vw; width: 100vw; height: 100vh; padding: 12px; margin: 0; align-items: stretch; gap: 14px; display: none;">
 <!-- LEFT DASHBOARD (PLAYER 1) -->
 <div style="flex: 1; background: #fff; border-radius: 16px; border: 1px solid #cbd5e1; display: flex; flex-direction: column; padding: 14px;">
 <div style="background: var(--blue-team); color: #fff; padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px;">
 <span id="dash-p1-title">1-Jamoa</span>
 </div>
 <div id="p1-formula-box" style="flex: 0.6; background: #f8fafc; border-radius: 12px; margin: 12px 0 6px 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: bold; color: var(--blue-team); border: 1px solid #e2e8f0; padding: 10px;"></div>
 <div id="p1-preview" class="answer-preview-screen" style="height: 48px; display: flex; align-items: center; justify-content: center;"></div>
 <!-- P1 Keypad panel layout matrix container -->
 <div id="p1-keypad-panel" style="width: 100%;">
 <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;">
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'1')">1</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'2')">2</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'3')">3</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'4')">4</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'5')">5</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'6')">6</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'7')">7</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'8')">8</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'9')">9</button>
 <button class="key-btn" style="background:#ef4444; color:#fff; padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'C')">✕</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'0')">0</button>
 <button class="key-btn" style="background:#f59e0b; color:#fff; padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(1,'R')">R</button>
 </div>
 <button class="key-btn" style="background:#3b82f6; color:#fff; width: 100%; padding: 14px 0; font-size: 18px; margin-top: 10px; font-weight: bold;" onclick="submitAnswer(1)">✓ Submit</button>
 </div>
 <!-- P1 Multiple choice options option pane elements layout overlay -->
 <div id="p1-mcq-panel" class="mcq-grid hidden">
 <button id="p1-opt-0" class="mcq-btn" onclick="submitMcqOption(1, 0)">-</button>
 <button id="p1-opt-1" class="mcq-btn" onclick="submitMcqOption(1, 1)">-</button>
 <button id="p1-opt-2" class="mcq-btn" onclick="submitMcqOption(1, 2)">-</button>
 <button id="p1-opt-3" class="mcq-btn" onclick="submitMcqOption(1, 3)">-</button>
 </div>
 </div>
 <!-- TUG OF WAR CENTRAL VIDEO ARENA -->
 <div style="flex: 1.2; background: #fff; border-radius: 16px; border: 1px solid #cbd5e1; display: flex; flex-direction: column; padding: 14px; position: relative;">
 <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px;">
 <div><span id="center-p1-label" style="font-size: 12px; color: #94a3b8;">1-Jamoa</span></div>
 <div style="text-align: center;"><div style="background: #3b82f6; color: #fff; font-size: 11px; padding: 2px 10px; border-radius: 20px; font-weight: bold;">LEVEL 4</div><div style="font-size: 16px; font-weight: 800; color: #0284c7; margin-top:2px;">⏱ <span id="center-timer-text">00:00</span></div></div>
 <div style="text-align: right;"><span id="center-p2-label" style="font-size: 12px; color: #94a3b8;">2-Jamoa</span></div>
 </div>
 <div class="arena-wrapper">
 <div id="center-line-marker"></div>
 <video id="arena-video" autoplay loop muted playsinline style="width: 100% !important; height: 100% !important; object-fit: contain !important; background: #ffffff !important; transform-origin: center center; display: block !important; position: relative; z-index: 1;">
 <source id="video-source" src="assets/main.mp4" type="video/mp4">
 </video>
 </div>
 <div class="timer-track-wrapper"><div id="global-timer"></div></div>
 </div>
 <!-- RIGHT DASHBOARD (PLAYER 2) -->
 <div style="flex: 1; background: #fff; border-radius: 16px; border: 1px solid #cbd5e1; display: flex; flex-direction: column; padding: 14px;">
 <div style="background: var(--red-team); color: #fff; padding: 10px 14px; border-radius: 12px; display: flex; justify-content: space-between; font-weight: bold; font-size: 18px;">
 <span id="dash-p2-title">2-Jamoa</span>
 </div>
 <div id="p2-formula-box" style="flex: 0.6; background: #f8fafc; border-radius: 12px; margin: 12px 0 6px 0; display: flex; align-items: center; justify-content: center; font-size: 34px; font-weight: bold; color: var(--red-team); border: 1px solid #e2e8f0; padding: 10px;"></div>
 <div id="p2-preview" class="answer-preview-screen" style="height: 48px; display: flex; align-items: center; justify-content: center;"></div>
 <!-- P2 Keypad Panel Container -->
 <div id="p2-keypad-panel" style="width: 100%;">
 <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;">
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'1')">1</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'2')">2</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'3')">3</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'4')">4</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'5')">5</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'6')">6</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'7')">7</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'8')">8</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'9')">9</button>
 <button class="key-btn" style="background:#ef4444; color:#fff; padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'C')">✕</button>
 <button class="key-btn" style="padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'0')">0</button>
 <button class="key-btn" style="background:#f59e0b; color:#fff; padding:12px 0; font-size:20px; font-weight:bold;" onclick="pressKey(2,'R')">R</button>
 </div>
 <button class="key-btn" style="background:#ef4444; color:#fff; width: 100%; padding: 14px 0; font-size: 18px; margin-top: 10px; font-weight: bold;" onclick="submitAnswer(2)">✓ Submit</button>
 </div>
 <!-- P2 MCQ Panel Container -->
 <div id="p2-mcq-panel" class="mcq-grid hidden">
 <button id="p2-opt-0" class="mcq-btn" onclick="submitMcqOption(2, 0)">-</button>
 <button id="p2-opt-1" class="mcq-btn" onclick="submitMcqOption(2, 1)">-</button>
 <button id="p2-opt-2" class="mcq-btn" onclick="submitMcqOption(2, 2)">-</button>
 <button id="p2-opt-3" class="mcq-btn" onclick="submitMcqOption(2, 3)">-</button>
 </div>
 </div>
 </div>
 <!-- SUMMARY OVERLAY SCREEN -->
 <div id="summary-screen" class="screen" style="justify-content:center; align-items:center; min-height:100vh; display:none; background-color:#0f172a; width:100vw; max-width:100vw; padding:20px;">
 <div style="background-color:#1e293b; border:1px solid #334155; padding:35px; border-radius:16px; text-align:center; width:100%; max-width:540px; color:#fff;">
 <h2 style="margin-bottom:8px; text-transform:uppercase; color:#94a3b8; font-size:14px;">Tournament Concluded</h2>
 <h1 id="win-announcement" style="font-size:28px; margin-bottom:20px; color:#f59e0b; font-weight:800;">-</h1>
 <div style="background:rgba(15, 23, 42, 0.4); border:1px solid #334155; border-radius:12px; padding:18px; margin-bottom:25px; display:flex; flex-direction:column; gap:12px;">
 <div style="display:flex; justify-content:space-between; border-bottom:1px solid #334155; padding-bottom:8px;"><span style="color:#94a3b8;">Teams Competed:</span><span id="final-stats-scores">-</span></div>
 <div style="display:flex; justify-content:space-between;"><span style="color:#94a3b8;">Duration:</span><span id="final-stats-duration" style="color:#0284c7;">00:00</span></div>
 </div>
 <div style="display:flex; flex-direction:column; gap:12px;">
 <button class="btn btn-blue" style="width:100%;" onclick="startMatch()">🔄 Play Again</button>
 <button class="btn btn-slate" style="width:100%;" onclick="backToMenu()">Main Menu</button>
 </div>
 </div>
 </div>
 <!-- AUDIO MEDIA ASSETS -->
 <audio id="tournament-bg-audio" loop preload="auto"><source src="assets/audio.mp3" type="audio/mpeg"></audio>

 // 1. Initial State Configurations & Global Game Objects
 let config = {
 pool: [],
 level: 4,
 maxBound: 29,
 p1Name: '',
 p2Name: '',
 inputMode: 'KEYPAD'
 };
 let game = {
 modifier: 0,
 interval: null,
 time: 0,
 questionAge: 0,
 roundActive: false,
 ans: '',
 p1In: '',
 p2In: ''
 };
 let tournament = { p1RoundsWon: 0, p2RoundsWon: 0 }; // Switched to track actual match points
 const VIDEO_ASSETS = {
 blueWin: "assets/win_blue.mp4",
 redWin: "assets/win_red.mp4",
 idle: "assets/main.mp4"
 };

 // 2. Preloader Animation State Routines
 function updatePreloaderMeter(v) {
 const t = document.getElementById('load-status-text');
 const f = document.getElementById('loader-bar');
 if(t) t.innerText = `Loading Local Media Assets: ${v}%`;
 if(f) f.style.width = `${v}%`;
 }
 function dismissPreloader() {
 const o = document.getElementById('preloader-screen');
 if(o) {
 o.style.opacity = '0';
 setTimeout(() => { o.style.display = 'none'; }, 400);
 }
 }
 window.addEventListener('DOMContentLoaded', () => {
 const p = document.getElementById('asset-preloader');
 if (!p) { dismissPreloader(); return; }
 p.src = VIDEO_ASSETS.idle;
 try { p.load(); } catch(e) {}
 let fake = 0;
 const fallbackInt = setInterval(() => {
 fake += 10;
 if (fake <= 90) updatePreloaderMeter(fake);
 }, 70);
 const forceTimeout = setTimeout(() => {
 clearInterval(fallbackInt);
 updatePreloaderMeter(100);
 setTimeout(dismissPreloader, 150);
 }, 1000);
 p.addEventListener('canplaythrough', () => {
 clearInterval(fallbackInt);
 clearTimeout(forceTimeout);
 updatePreloaderMeter(100);
 setTimeout(dismissPreloader, 150);
 });
 });
 // 3. Audio manager triggers
 function toggleMatchAudio(cmd) {
 const a = document.getElementById('tournament-bg-audio');
 if (!a) return;
 if (cmd === 'play') { a.currentTime = 0; a.play().catch(e => {}); } else { a.pause(); a.currentTime = 0; }
 }
 // 4. Viewport Screen Switching & Layout Animators
 function showScreen(id) {
 document.querySelectorAll('.screen').forEach(s => {
 s.style.setProperty('display', 'none', 'important');
 s.classList.remove('active');
 });
 const target = document.getElementById(id);
 if (!target) return;
 if (id === 'game-screen' || id === 'summary-screen' || id === 'settings-screen' || id === 'menu-screen') {
 target.style.setProperty('display', 'flex', 'important');
 if (id !== 'game-screen') {
 target.style.setProperty('flex-direction', 'column', 'important');
 target.style.setProperty('align-items', 'center', 'important');
 target.style.setProperty('justify-content', 'center', 'important');
 target.style.setProperty('min-height', '100vh', 'important');
 }
 } else { target.style.display = 'block'; }
 target.classList.add('active');
 }
 function openSettings() { showScreen('settings-screen'); }
 function backToMenu() { clearInterval(game.interval); game.roundActive = false; toggleMatchAudio('stop'); showScreen('menu-screen'); }

 // 5. Level 4 Match Configuration Launcher
 function startMatch() {
 config.p1Name = document.getElementById('t1-name-input').value.trim() || '1-Jamoa';
 config.p2Name = document.getElementById('t2-name-input').value.trim() || '2-Jamoa';
 config.inputMode = document.getElementById('match-input-mode-select').value;
 config.pool = [];
 if(document.getElementById('q-add').checked) config.pool.push('add');
 if(document.getElementById('q-sub').checked) config.pool.push('sub');
 if(document.getElementById('q-mul').checked) config.pool.push('mul');
 if(document.getElementById('q-div').checked) config.pool.push('div');
 if(document.getElementById('strat-pow10').checked) config.pool.push('pow10');
 if(document.getElementById('strat-assoc').checked) config.pool.push('assoc');
 if(document.getElementById('strat-dist').checked) config.pool.push('dist');
 if(document.getElementById('strat-rem').checked) config.pool.push('rem');
 if(document.getElementById('strat-tens').checked) config.pool.push('tens');
 if(config.pool.length === 0) config.pool.push('add');
 document.getElementById('dash-p1-title').innerText = config.p1Name;
 document.getElementById('dash-p2-title').innerText = config.p2Name;
 document.getElementById('center-p1-label').innerText = config.p1Name;
 document.getElementById('center-p2-label').innerText = config.p2Name;

 // Dynamic rendering layout logic toggle based on chosen input mode configuration
 if (config.inputMode === 'MCQ') {
 document.getElementById('p1-keypad-panel').classList.add('hidden');
 document.getElementById('p2-keypad-panel').classList.add('hidden');
 document.getElementById('p1-mcq-panel').classList.remove('hidden');
 document.getElementById('p2-mcq-panel').classList.remove('hidden');
 } else {
 document.getElementById('p1-keypad-panel').classList.remove('hidden');
 document.getElementById('p2-keypad-panel').classList.remove('hidden');
 document.getElementById('p1-mcq-panel').classList.add('hidden');
 document.getElementById('p2-mcq-panel').classList.add('hidden');
 }

 // Reset match parameters on start
 if(game.currentRound === 1 || !game.currentRound) {
 tournament.p1RoundsWon = 0;
 tournament.p2RoundsWon = 0;
 game.currentRound = 1;
 }

 game.modifier = 0;
 game.roundActive = true;
 game.time = 0;
 game.questionAge = 0;
 switchVideoState('idle');
 updateVisualPosition();
 generateQuestion();
 showScreen('game-screen');
 startTimer();
 toggleMatchAudio('play');
 }
 // 6. Level 4 Question Generation Engine
 function generateQuestion() {
 let stroke = '', ans = '';
 let choice = config.pool[Math.floor(Math.random() * config.pool.length)];
 let max = config.maxBound;
 if (choice === 'pow10') {
 let base = Math.floor(Math.random() * (max - 1)) + 2;
 let pArr = "10,100,1000".split(",");
 let pow = parseInt(pArr[Math.floor(Math.random() * 3)]);
 stroke = `${base} \\times ${pow} = ?`; ans = (base * pow).toString();
 } else if (choice === 'assoc') {
 let pairsList = "2-5,4-5,8-5,2-25,4-25,8-25".split(",");
 let chosenPairStr = pairsList[Math.floor(Math.random() * pairsList.length)];
 let pairParts = chosenPairStr.split("-");
 let f1 = parseInt(pairParts[0]);
 let f2 = parseInt(pairParts[1]);
 let f3 = Math.floor(Math.random() * 7) + 3;
 let els = new Array(f1, f2, f3).sort(() => Math.random() - 0.5);
 stroke = `${els[0]} \\times ${els[1]} \\times ${els[2]} = ?`;
 ans = (f1 * f2 * f3).toString();
 } else if (choice === 'dist') {
 let multiDigit = Math.floor(Math.random() * 89) + 11;
 let singleDigit = Math.floor(Math.random() * 8) + 2;
 stroke = `${multiDigit} \\times ${singleDigit} = ?`;
 ans = (multiDigit * singleDigit).toString();
 } else if (choice === 'rem') {
 let div = Math.floor(Math.random() * 8) + 2;
 let q = Math.floor(Math.random() * 15) + 3;
 let rem = Math.floor(Math.random() * div);
 stroke = `${(q * div + rem)} \\div ${div} = ?`; ans = rem > 0 ? `${q}R${rem}` : q.toString();
 } else if (choice === 'tens') {
 let div = Math.floor(Math.random() * 9) + 2;
 let base = (Math.floor(Math.random() * 9) + 1) * div;
 let sArr = "10,100,1000".split(",");
 let scale = parseInt(sArr[Math.floor(Math.random() * 3)]);
 stroke = `${(base * scale)} \\div ${div} = ?`; ans = (base * scale / div).toString();
 } else {
 let fallback = runStandardMath(choice, max);
 stroke = fallback.stroke; ans = fallback.ans;
 }
 game.ans = ans; game.p1In = ''; game.p2In = '';
 document.getElementById('p1-preview').innerText = ''; document.getElementById('p2-preview').innerText = '';
 katex.render(stroke, document.getElementById('p1-formula-box'));
 katex.render(stroke, document.getElementById('p2-formula-box'));
 if (config.inputMode === 'MCQ') { assembleMcqOptions(ans); }
 }

 function runStandardMath(choice, max) {
 let stroke = '', ans = '';
 if (choice === 'add') {
 let v1 = Math.floor(Math.random() * 75) + 20;
 let v2 = Math.floor(Math.random() * 75) + 20;
 stroke = `${v1} + ${v2} = ?`; ans = (v1 + v2).toString();
 } else if (choice === 'sub') {
 let v1 = Math.floor(Math.random() * 75) + 24;
 let v2 = Math.floor(Math.random() * 75) + 15;
 if (v1 < v2) { let t = v1; v1 = v2; v2 = t; }
 stroke = `${v1} - ${v2} = ?`; ans = (v1 - v2).toString();
 } else if (choice === 'mul') {
 let v1 = Math.floor(Math.random() * 7) + 6;
 let v2 = Math.floor(Math.random() * 9) + 4;
 stroke = `${v1} \\times ${v2} = ?`; ans = (v1 * v2).toString();
 } else {
 let b = Math.floor(Math.random() * 7) + 4;
 let q = Math.floor(Math.random() * 11) + 10;
 stroke = `${(b * q)} \\div ${b} = ?`; ans = q.toString();
 }
 return { stroke: stroke, ans: ans };
 }
 // Corrected MCQ Tracker Generator
 function assembleMcqOptions(correctAnswer) {
 let optionsSet = new Set();
 optionsSet.add(correctAnswer);
 let isRemainderType = correctAnswer.includes('R');
 let baseVal = 0, remVal = 0;
 if (isRemainderType) {
 let parts = correctAnswer.split('R');
 baseVal = parseInt(parts[0]); remVal = parseInt(parts[1]);
 } else {
 baseVal = parseInt(correctAnswer);
 }
 while (optionsSet.size < 4) {
 let fakeOption = '';
 if (isRemainderType) {
 let offsetQ = Math.floor(Math.random() * 7) - 3;
 let offsetR = Math.floor(Math.random() * 5) - 2;
 let fQ = Math.max(1, baseVal + offsetQ);
 let fR = Math.max(0, remVal + offsetR);
 fakeOption = fR > 0 ? `${fQ}R${fR}` : fQ.toString();
 } else {
 let mArr = "10,20,-10,-20,1,2,3,-1,-2,-3".split(",");
 let pick = parseInt(mArr[Math.floor(Math.random() * mArr.length)]);
 fakeOption = Math.max(1, baseVal + pick).toString();
 }
 optionsSet.add(fakeOption);
 }
 let flatOptions = Array.from(optionsSet).sort(() => Math.random() - 0.5);
 for (let i = 0; i < 4; i++) {
 document.getElementById(`p1-opt-${i}`).innerText = flatOptions[i];
 document.getElementById(`p2-opt-${i}`).innerText = flatOptions[i];
 }
 }

 // 7. Interactive Routers & Evaluation Engines
 function submitMcqOption(playerIndex, optionIndex) {
 let chosenText = document.getElementById(`p${playerIndex}-opt-${optionIndex}`).innerText;
 evaluateAnswer(playerIndex, chosenText);
 }
 function pressKey(p, key) {
 if (key === 'C') {
 if (p === 1) game.p1In = game.p1In.slice(0, -1); else game.p2In = game.p2In.slice(0, -1);
 } else {
 if (key === 'R') {
 let buf = p === 1 ? game.p1In : game.p2In;
 if(buf.includes('R') || buf === '') return;
 }
 if (p === 1) game.p1In += key; else game.p2In += key;
 }
 document.getElementById(`p${p}-preview`).innerText = p === 1 ? game.p1In : game.p2In;
 }
 function submitAnswer(p) {
 if (!game.roundActive) return;
 evaluateAnswer(p, p === 1 ? game.p1In : game.p2In);
 }

 function evaluateAnswer(p, str) {
 if (!game.roundActive) return;
 let input = str.trim().toUpperCase();
 let target = game.ans.trim().toUpperCase();
 if (input === target) {
 let pullSteps = 1;
 if (game.questionAge <= 5.0) pullSteps = 3;
 else if (game.questionAge <= 10.0) pullSteps = 2;

 if (p === 1) {
 game.modifier += pullSteps;
 triggerFloatingScorePop(1, `+${pullSteps} steps`);
 } else {
 game.modifier -= pullSteps;
 triggerFloatingScorePop(2, `+${pullSteps} steps`);
 }
 updateVisualPosition();
 if (Math.abs(game.modifier) >= 30) {
 resolveVictory(game.modifier > 0 ? 1 : 2);
 } else {
 game.questionAge = 0;
 generateQuestion();
 }
 } else {
 if (p === 1) {
 game.modifier = Math.max(-35, game.modifier - 1);
 triggerFloatingScorePop(1, `-1 step`);
 } else {
 game.modifier = Math.min(35, game.modifier + 1);
 triggerFloatingScorePop(2, `-1 step`);
 }
 updateVisualPosition();
 if (Math.abs(game.modifier) >= 30) resolveVictory(game.modifier > 0 ? 1 : 2);
 }
 if (p === 1) { game.p1In = ''; document.getElementById('p1-preview').innerText = ''; }
 else { game.p2In = ''; document.getElementById('p2-preview').innerText = ''; }
 }

 function triggerFloatingScorePop(p, txt) {
 const pop = document.createElement('div');
 pop.className = 'floating-score-pop pop-p' + p;
 pop.innerText = txt;
 document.body.appendChild(pop);
 setTimeout(() => pop.remove(), 1200);
 }

 function updateVisualPosition() {
 const video = document.getElementById('arena-video');
 if (!video) return;
 const displacement = game.modifier * -12;
 const clamped = Math.max(-700, Math.min(700, displacement));
 video.style.transform = `translateX(${clamped}px)`;
 video.style.transition = 'transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
 }

 function checkOffScreenWinCondition() {
 const absoluteStepLimit = 30;
 if (game.modifier >= absoluteStepLimit) { resolveVictory(1); return true; }
 else if (game.modifier <= -absoluteStepLimit) { resolveVictory(2); return true; }
 return false;
 }
 function switchVideoState(key) {
 const v = document.getElementById('arena-video');
 const s = document.getElementById('video-source');
 if (!v || !s) return;
 let url = VIDEO_ASSETS[key];
 if (s.getAttribute('src') !== url) {
 s.setAttribute('src', url);
 v.load();
 v.loop = true;
 v.play().catch(e => {});
 }
 }

 function resolveVictory(winnerIndex) {
 const bgAudio = document.getElementById('tournament-bg-audio');
 if (bgAudio) { bgAudio.pause(); bgAudio.currentTime = 0; }
 const clapTrack = document.getElementById('tournament-applause-audio');
 if (clapTrack) {
 clapTrack.currentTime = 0;
 let loops = 1;
 clapTrack.onended = function() {
 if (loops < 2) { loops++; clapTrack.currentTime = 0; clapTrack.play().catch(e=>{}); }
 };
 clapTrack.play().catch(e => {});
 }
 clearInterval(game.interval);
 game.roundActive = false;
 const matchDivider = document.getElementById('center-line-marker');
 if (matchDivider) matchDivider.style.setProperty('display', 'none', 'important');
 const video = document.getElementById('arena-video');
 let totalSecs = Math.round(game.time);
 let m = Math.floor(totalSecs / 60);
 let s = totalSecs % 60;
 let timingString = `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
 let msg = winnerIndex === 1 ? `${config.p1Name} Wins This Round!` : `${config.p2Name} Wins This Round!`;

 if (winnerIndex === 1) { tournament.p1RoundsWon = (tournament.p1RoundsWon || 0) + 1; }
 else { tournament.p2RoundsWon = (tournament.p2RoundsWon || 0) + 1; }

 switchVideoState(winnerIndex === 1 ? 'blueWin' : 'redWin');
 if (video) video.style.transform = 'translateX(0px)';
 document.getElementById('win-announcement').innerText = msg;
 setTimeout(() => {
 if (matchDivider) matchDivider.style.display = 'block';
 if (game.currentRound < config.totalRounds) { game.currentRound++; startMatch(); }
 else {
 let finalDeclaration = "Tournament Ended in a Draw!";
 if (tournament.p1RoundsWon > tournament.p2RoundsWon) {
 finalDeclaration = `${config.p1Name} Wins the Tournament!`;
 } else if (tournament.p2RoundsWon > tournament.p1RoundsWon) {
 finalDeclaration = `${config.p2Name} Wins the Tournament!`;
 }
 document.getElementById('win-announcement').innerText = finalDeclaration;
 document.getElementById('final-stats-scores').innerText = `${config.p1Name} vs ${config.p2Name}`;
 document.getElementById('final-stats-duration').innerText = timingString;
 game.currentRound = 1;
 showScreen('summary-screen');
 }
 }, 15000);
 }

 function startTimer() {
 clearInterval(game.interval);
 game.interval = setInterval(() => {
 if(!game.roundActive) return;
 game.time += 0.1;
 game.questionAge += 0.1;

 // 30-Second Rule: Skip question instantly when timer runs out
 if (game.questionAge >= 30.0) {
 game.questionAge = 0;
 generateQuestion();
 game.p1In = ''; game.p2In = '';
 const pr1 = document.getElementById('p1-preview');
 const pr2 = document.getElementById('p2-preview');
 if (pr1) pr1.innerText = ''; if (pr2) pr2.innerText = '';
 return;
 }

 let secs = Math.floor(game.time);
 document.getElementById('center-timer-text').innerText = `${Math.floor(secs/60)}:${(secs%60) < 10 ? '0' : ''}${secs%60}`;

 // Visual Track Sync: Bar fills relative to the tighter 30s question skip threshold
 let track = document.getElementById('global-timer');
 if(track) track.style.width = `${Math.min(100, (game.questionAge / 30) * 100)}%`;
 }, 100);
 }

 window.addEventListener('keydown', (e) => {
 if(!document.getElementById('game-screen').classList.contains('active')) return;
 if(config.inputMode !== 'KEYPAD') return;
 if(/[0-9]/.test(e.key)) pressKey(1, e.key);
 else if(e.key.toUpperCase() === 'R') pressKey(1, 'R');
 else if(e.key === 'Backspace') pressKey(1, 'C');
 else if(e.key === 'Enter') submitAnswer(1);
 });
 </script>
</body>
