<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mental Math Shortcuts Game</title>
    <!-- KaTeX CSS & JS Library -->
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/katex.min.js"></script>    <!-- Essential: The auto-render extension -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.27/dist/contrib/auto-render.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --error: #ef4444;
            --success: #22c55e;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        .screen { display: none; }
        .screen.active { display: block; }
        .grade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .grade-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #334155;
        }
        .trick-item {
            background: rgba(255,255,255,0.05);
            margin: 8px 0;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.2s;
        }
        .trick-item:hover { background: var(--accent); }
        .tag { font-size: 0.75rem; color: var(--text-muted); background: #334155; padding: 2px 6px; border-radius: 4px; }
        .quiz-box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 600px;
            margin: 40px auto;
            position: relative;
        }
        .back-btn { background: none; border: 1px solid var(--text-muted); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; }
        .math-expr { font-size: 2.5rem; margin: 30px 0; }
        .box-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        .digit-input { width: 45px; height: 55px; font-size: 1.8rem; text-align: center; background: #0f172a; color: #fff; border: 2px solid var(--text-muted); border-radius: 6px; }
        .digit-input.correct { border-color: var(--success); }
        .digit-input.wrong { border-color: var(--error); }
        .hint-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
            z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .hint-overlay.show { opacity: 1; pointer-events: auto; }
        .hint-box { background: var(--card-bg); padding: 30px; border-radius: 12px; max-width: 500px; text-align: center; border: 2px solid var(--error); }
    </style>
</head>
<body>
<div class="container">

    <!-- DASHBOARD -->
    <div id="dashboard" class="screen active">
        <h1 style="text-align:center;">Mental Math Practices</h1>
        <div class="grade-grid">
            <div class="grade-card"><h2>Grade 6</h2><div id="g6-container"></div></div>
            <div class="grade-card"><h2>Grade 7 <span style="font-size:1rem;color:var(--text-muted)">(+G6)</span></h2><div id="g7-container"></div></div>
            <div class="grade-card"><h2>Grade 8 <span style="font-size:1rem;color:var(--text-muted)">(+G6+G7)</span></h2><div id="g8-container"></div></div>
        </div>
    </div>

    <!-- QUIZ PAGE -->
    <div id="quiz" class="screen">
        <div class="quiz-box">
            <button class="back-btn" onclick="goToDashboard()">← Back</button>
            <h3 id="quiz-title" style="margin-top:20px; color:var(--accent);"></h3>
            <div class="math-expr" id="problem-expr"></div>
            <div class="box-row" id="inputs-container"></div>
            <div id="status-msg" style="font-size:1.2rem; color:var(--success); font-weight:bold;"></div>
        </div>
    </div>

</div>

<!-- FLOATING OVERLAY HINT -->
<div class="hint-overlay" id="hint-modal">
    <div class="hint-box">
        <h3 style="color:var(--error); margin-top:0;">💡 Mental Strategy Hint</h3>
        <div id="hint-message" style="font-size:1.1rem; text-align:left; margin-bottom:20px; line-height:1.5;"></div>
        <button class="back-btn" onclick="dismissHint()">Continue Practice</button>
    </div>
</div>
<script>
const DATABASE = {
    // --- GRADE 6 ---
    "g6_m11_nc": { title: "Multiply 11 (No Carry)", gen: () => {
        let a = Math.floor(Math.random() * 6) + 1, b = Math.floor(Math.random() * (9 - a));
        let n = a * 10 + b;
        return { exp: `${n} \\times 11`, ans: (n*11).toString(), hint: `For **${n} × 11**:<br>• Outer digits remain **${a}** and **${b}**.<br>• Center digit is the sum: $${a} + ${b} = ${a+b}$.` };
    }},
    "g6_m11_wc": { title: "Multiply 11 (With Carry)", gen: () => {
        let a = Math.floor(Math.random() * 5) + 5, b = Math.floor(Math.random() * 5) + 5;
        let n = a * 10 + b;
        return { exp: `${n} \\times 11`, ans: (n*11).toString(), hint: `For **${n} × 11**:<br>• Ends in **${b}**.<br>• Center sum $${a} + ${b} = ${a+b}$. Write down **${(a+b)%10}** and carry **1** to the front digit: $${a} + 1 = ${a+1}$.` };
    }},
    "g6_e5_sq": { title: "Ending in 5 Squared", gen: () => {
        let a = Math.floor(Math.random() * 9) + 1, n = a * 10 + 5;
        return { exp: `${n}^2`, ans: (n*n).toString(), hint: `For **${n}²**:<br>• The answer always ends in **25**.<br>• Multiply the front tens digit by the next integer: $${a} \\times (${a} + 1) = ${a*(a+1)}$.` };
    }},
    "g6_d5": { title: "Dividing by 5", gen: () => {
        // Generates an integer multiplier so the final number ends in 0 or 5
        let multiplier = Math.floor(Math.random() * 180) + 10;
        let n = multiplier * 5;

        let unitsDigit = n % 10;
        let remainingNum = Math.floor(n / 10);
        let doubledRemaining = remainingNum * 2;
        let addition = unitsDigit === 5 ? 1 : 0;

        let explanation = unitsDigit === 5
            ? `• Units digit is **5**.<br>• Remove it to leave: **${remainingNum}**.<br>• Double it: $${remainingNum} \\times 2 = ${doubledRemaining}$.<br>• Since it ended in 5, add 1: $${doubledRemaining} + 1 = ${n/5}$.`
            : `• Units digit is **0**.<br>• Remove it to leave: **${remainingNum}**.<br>• Double it: $${remainingNum} \\times 2 = ${doubledRemaining}$.<br>• Since it ended in 0, add nothing: **${n/5}**.`;

        return {
            exp: `${n} \\div 5`,
            ans: (n / 5).toString(),
            hint: `For **${n} ÷ 5**:<br>${explanation}`
        };
    }},
    "g6_m2": { title: "Multiplying by 2", gen: () => {
        let n = Math.floor(Math.random() * 450) + 50; // Generates a random number between 50 and 499

        let unitsDigit = n % 10;
        let remainingNum = Math.floor(n / 10);
        let doubledRemaining = remainingNum * 2;
        let attachedZero = doubledRemaining * 10;
        let doubledUnits = unitsDigit * 2;

        return {
            exp: `${n} \\times 2`,
            ans: (n * 2).toString(),
            hint: `For **${n} × 2**:<br>• Remove the units digit to get: **${remainingNum}**.<br>• Double it: $${remainingNum} \\times 2 = ${doubledRemaining}$.<br>• Attach a 0 to it: **${attachedZero}**.<br>• Double the original units digit: $${unitsDigit} \\times 2 = ${doubledUnits}$.<br>• Add them together: $${attachedZero} + ${doubledUnits} = ${n*2}$.`
        };
    }},

    "g6_m22_99": { title: "Multiply 22, 33..99", gen: () => {
        let d = Math.floor(Math.random() * 8) + 2, mult = d * 11, v = Math.floor(Math.random() * 6) + 2;
        return { exp: `${v} \\times ${mult}`, ans: (v*mult).toString(), hint: `Break down **${v} × ${mult}**:<br>• First calculate $${v} \\times ${d} = ${v*d}$.<br>• Next, multiply that result by 11: $${v*d} \\times 11$.` };
    }},
    "g6_m101": { title: "Multiply 2-digit by 101", gen: () => {
        let n = Math.floor(Math.random() * 89) + 10;
        return { exp: `${n} \\times 101`, ans: (n*101).toString(), hint: `Multiplying any 2-digit integer by **101** simply duplicates the number sequence side by side: **${n}${n}**.` };
    }},

    // --- GRADE 7 ---
    "g7_me5": { title: "Multiply Ending in 5", gen: () => {
        let n = (Math.floor(Math.random() * 8) + 2) * 10 + 5;
        return { exp: `${n} \\times 4`, ans: (n*4).toString(), hint: `For **${n} × 4**:<br>• Steal a factor of 2 from 4 to double the 5-ended value: $${n} \\times 2 = ${n*2}$.<br>• Compute the rest easily: $${n*2} \\times 2 = ${n*4}$.` };
    }},
    "g7_st_o10": { title: "Same Tens, Ones = 10", gen: () => {
        let t = Math.floor(Math.random() * 8) + 1, o1 = Math.floor(Math.random() * 8) + 1, o2 = 10 - o1;
        let n1 = t*10 + o1, n2 = t*10 + o2;
        return { exp: `${n1} \\times ${n2}`, ans: (n1*n2).toString(), hint: `Since tens match (${t}) and units add to 10:<br>• Front part: $${t} \\times (${t} + 1) = ${t*(t+1)}$.<br>• Back part: $${o1} \\times ${o2} = ${o1*o2}$.` };
    }},
    "g7_teens": { title: "Teens Mul (11-19)", gen: () => {
        let a = Math.floor(Math.random() * 9) + 11, b = Math.floor(Math.random() * 9) + 11;
        return { exp: `${a} \\times ${b}`, ans: (a*b).toString(), hint: `For **${a} × ${b}**:<br>• Add total of one to the units position of the other: $${a} + ${b%10} = ${a+(b%10)}$.<br>• Multiply that sum by 10, then add the product of unit positions: $${a%10} \\times ${b%10} = ${(a%10)*(b%10)}$.` };
    }},
    "g7_even5": { title: "Multiply Even by 5", gen: () => {
        let n = (Math.floor(Math.random() * 40) + 10) * 2;
        return { exp: `${n} \\times 5`, ans: (n*5).toString(), hint: `To multiply an even value by 5:<br>• Divide the sequence cleanly in half: $${n} \\div 2 = ${n/2}$.<br>• Append a zero (multiply by 10): **${n*5}**.` };
    }},

    // --- GRADE 8 ---
    "g8_n5": { title: "Multiply n5 x n5", gen: () => {
        let n = Math.floor(Math.random() * 8) + 1, val = n*10 + 5;
        return { exp: `${val} \\times ${val}`, ans: (val*val).toString(), hint: `Follows the standard square pattern ending in 5:<br>• Calculate $${n} \\times (${n} + 1)$ for the front value and tag **25** on the end.` };
    }},
    "g8_comp": { title: "Complements 100/1000", gen: () => {
        let base = Math.random() > 0.5 ? 100 : 1000;
        let n = base === 100 ? Math.floor(Math.random()*89)+10 : Math.floor(Math.random()*899)+100;
        return { exp: `${base} - ${n}`, ans: (base-n).toString(), hint: `Subtract every digit from **9** systematically from left to right, except subtract the final digit from **10**.` };
    }},
    "g8_su_t10": { title: "Same Units, Tens = 10", gen: () => {
        let u = Math.floor(Math.random() * 8) + 1, t1 = Math.floor(Math.random() * 8) + 1, t2 = 10 - t1;
        let n1 = t1*10 + u, n2 = t2*10 + u;
        return { exp: `${n1} \\times ${n2}`, ans: (n1*n2).toString(), hint: `Since units match and tens sum to 10:<br>• Front: $(Tens_1 \\times Tens_2) + Units \\rightarrow (${t1} \\times ${t2}) + ${u} = ${t1*t2+u}$.<br>• Back: $Units \\times Units = ${u*u}$ (use 2 digits).` };
    }},
    "g8_3d11": { title: "3+ Digits × 11", gen: () => {
        let n = Math.floor(Math.random() * 700) + 120;
        return { exp: `${n} \\times 11`, ans: (n*11).toString(), hint: `For **${n} × 11**:<br>• Keep the outer digits, and find intermediate values by adding neighboring digits from right to left.` };
    }},
    "g8_big5": { title: "Multiply 2-3 Digits by 5", gen: () => {
        let n = Math.floor(Math.random() * 899) + 100;
        return { exp: `${n} \\times 5`, ans: (n*5).toString(), hint: `Divide the value in half ($${n} \\div 2 = ${n/2}$), then scale by multiplying by 10.` };
    }},
    "g8_m101_202": { title: "Multiply by 101, 202...", gen: () => {
        let factor = Math.floor(Math.random() * 3) + 1, mult = 101 * factor, v = Math.floor(Math.random() * 30) + 11;
        return { exp: `${v} \\times ${mult}`, ans: (v*mult).toString(), hint: `Rewrite expression as: $(${v} \\times ${factor}) \\times 101$. Calculate the product inside parentheticals first, then duplicate it.` };
    }}
};

// Map levels using structural mapping requirements
const SCHEMES = {
    g6: ["g6_m11_nc", "g6_m11_wc", "g6_e5_sq", "g6_d5", "g6_m2", "g6_m22_99", "g6_m101"],
    g7: ["g6_e5_sq", "g6_d5", "g6_m2", "g6_m22_99", "g7_st_o10", "g6_m11_wc", "g7_teens", "g7_even5"],
    g8: ["g6_e5_sq", "g6_d5", "g6_m2", "g6_m22_99", "g7_st_o10", "g6_m11_wc", "g7_teens", "g8_comp", "g8_su_t10", "g8_3d11", "g8_big5", "g8_m101_202"]
};

</script>
<script>
let currentChallenge = null;

window.addEventListener("DOMContentLoaded", () => {
    buildMenu("g6-container", SCHEMES.g6, "g6");
    buildMenu("g7-container", SCHEMES.g7, "g7");
    buildMenu("g8-container", SCHEMES.g8, "g8");
});

function buildMenu(domId, keys, standardPrefix) {
    const root = document.getElementById(domId);
    keys.forEach(k => {
        const item = DATABASE[k];
        if (!item) return;
        const div = document.createElement("div");
        div.className = "trick-item";

        let isInherited = !k.startsWith(standardPrefix);
        div.innerHTML = `<span>${item.title}</span> ${isInherited ? '<span class="tag">Inherited</span>' : ''}`;
        div.onclick = () => initQuiz(k);
        root.appendChild(div);
    });
}

function initQuiz(key) {
    const trick = DATABASE[key];
    currentChallenge = trick.gen();

    document.getElementById("quiz-title").innerText = trick.title;
    document.getElementById("status-msg").innerText = "";

    const exprDiv = document.getElementById("problem-expr");
    katex.render(currentChallenge.exp + " = ?", exprDiv, { throwOnError: false });

    const row = document.getElementById("inputs-container");
    row.innerHTML = "";

    const totalDigits = currentChallenge.ans.length;
    for (let i = 0; i < totalDigits; i++) {
        const input = document.createElement("input");
        input.type = "text";
        input.maxLength = 1;
        input.className = "digit-input";
        input.dataset.index = i;

        input.addEventListener("input", (e) => verifyDigit(e, input, i, currentChallenge.ans));
        row.appendChild(input);
    }

    changeView("quiz");
    setTimeout(() => row.children[0]?.focus(), 150);
}

function verifyDigit(e, element, index, fullSolution) {
    const inputChar = element.value.trim();
    if (!inputChar) return;

    if (inputChar === fullSolution[index]) {
        element.classList.remove("wrong");
        element.classList.add("correct");
        element.disabled = true;

        const nextInput = element.nextElementSibling;
        if (nextInput) {
            nextInput.focus();
        } else {
            document.getElementById("status-msg").innerText = "🎉 Brilliant! Correct Answer.";
        }
    } else {
        element.classList.add("wrong");
        element.value = "";
        triggerHintOverlay(currentChallenge.hint);
    }
}

function triggerHintOverlay(hintMarkup) {
    const box = document.getElementById("hint-message");
    box.innerHTML = hintMarkup;

    // Parse any math equations present inside the hint message string
    const regex = /\$([^\$]+)\$/g;
    box.innerHTML = box.innerHTML.replace(regex, (match, expression) => {
        try { return katex.renderToString(expression, { displayMode: false }); }
        catch (err) { return expression; }
    });

    document.getElementById("hint-modal").classList.add("show");
}

function dismissHint() {
    document.getElementById("hint-modal").classList.remove("show");
    const fields = document.getElementById("inputs-container").children;
    for (let el of fields) {
        if (!el.disabled) {
            el.focus();
            break;
        }
    }
}

function changeView(id) {
    document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function goToDashboard() { changeView("dashboard"); }
</script>
</body>
</html>
